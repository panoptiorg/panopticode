name: pr-title

# PRs are squash-merged and the PR title becomes the commit message on main.
# release-please reads those messages to pick the next version and write the
# changelog, so the title has to be a Conventional Commit:
#
#   feat: ...          new behaviour             -> minor bump (pre-1.0)
#   fix(scope): ...    bug fix                   -> patch bump
#   feat!: ...         breaking change           -> minor bump while 0.x
#   docs|test|ci|build|chore|refactor|perf|style|revert: ...
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - name: check PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if [[ ! "$TITLE" =~ $re ]]; then
            echo "::error::PR title is not a Conventional Commit: \"$TITLE\". Use e.g. \"feat(core): ...\" or \"fix: ...\"."
            exit 1
          fi
          echo "ok: $TITLE"
