[package]
name = "panopticode"
version = "0.1.0"
edition = "2021"
description = "Compositional cross-repo taint analysis over a language-neutral code graph (CGF)"
license = "Apache-2.0"
repository = "https://github.com/panoptiorg/panopticode"
readme = "../README.md"
keywords = ["static-analysis", "taint-analysis", "security", "dataflow", "sast"]
categories = ["development-tools"]

[[bin]]
name = "panopticode"
path = "src/main.rs"

[dependencies]
prost = "0.13"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
moka = { version = "0.12", features = ["sync"] }
regex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "macros", "json"] }

[build-dependencies]
prost-build = "0.13"
